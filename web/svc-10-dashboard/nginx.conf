server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: BrowserRouter uses HTML5 history, so a hard refresh
    # or direct deep-link to a client route (/scans/<uuid>, /submit, /stats,
    # /rules) must serve index.html rather than nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
